name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HKO_BOT_STATE_KV_NAMESPACE_ID: ${{ secrets.HKO_BOT_STATE_KV_NAMESPACE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$HKO_BOT_STATE_KV_NAMESPACE_ID"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Generate webhook setup secret
        id: webhook-setup-secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "value=$secret" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler CI config
        run: |
          sed "s/replace_with_your_kv_namespace_id/${HKO_BOT_STATE_KV_NAMESPACE_ID}/" wrangler.toml > wrangler.ci.toml

      - name: Deploy Worker
        run: |
          bunx wrangler deploy --config wrangler.ci.toml

      - name: Sync Worker secrets
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | bunx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.ci.toml
          printf '%s' "$TELEGRAM_CHAT_ID" | bunx wrangler secret put TELEGRAM_CHAT_ID --config wrangler.ci.toml
          printf '%s' "${{ steps.webhook-setup-secret.outputs.value }}" | bunx wrangler secret put TELEGRAM_WEBHOOK_SETUP_SECRET --config wrangler.ci.toml
          if [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | bunx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.ci.toml
          fi

      - name: Redeploy Worker with synced secrets
        id: deploy
        run: |
          bunx wrangler deploy --config wrangler.ci.toml 2>&1 | tee wrangler-deploy.log
          worker_url="$(awk 'match($0, /https:\/\/[^[:space:]]+\.workers\.dev/) { url=substr($0, RSTART, RLENGTH) } END { print url }' wrangler-deploy.log)"
          if [ -z "$worker_url" ]; then
            echo "Unable to determine Worker URL from Wrangler output." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Set Telegram webhook
        run: |
          curl --fail-with-body \
            --request POST \
            --header "authorization: Bearer ${{ steps.webhook-setup-secret.outputs.value }}" \
            --header "content-type: application/json" \
            --data "{}" \
            "${{ steps.deploy.outputs.worker_url }}/telegram/set-webhook"
